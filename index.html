<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job Radar — Tableau de bord</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e8eaed;
    --muted: #8a90a2;
    --accent: #5b8cff;
    --accent-soft: rgba(91,140,255,0.12);
    --good: #4cd394;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .controls input, .controls select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 14px;
  }
  .controls input[type="text"] { flex: 1; min-width: 220px; }

  main { padding: 20px 32px 60px; max-width: 1000px; margin: 0 auto; }

  .stats { color: var(--muted); font-size: 13px; margin-bottom: 14px; }

  .job {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .job-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .job-title { font-size: 16px; font-weight: 600; }
  .job-title a { color: var(--text); text-decoration: none; }
  .job-title a:hover { color: var(--accent); }
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    white-space: nowrap;
  }
  .job-meta { color: var(--muted); font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; }
  .job-meta span::before { content: "•"; margin-right: 6px; color: var(--border); }
  .job-meta span:first-child::before { content: ""; margin-right: 0; }
  .new-tag { color: var(--good); font-weight: 600; }

  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
</style>
</head>
<body>

<header>
  <h1>🛰️ Job Radar</h1>
  <p>Offres collectées automatiquement depuis France Travail et LinkedIn, filtrées selon tes critères.</p>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="Rechercher un mot-clé (titre, entreprise)..." />
  <select id="sourceFilter">
    <option value="">Toutes les sources</option>
    <option value="France Travail">France Travail</option>
    <option value="LinkedIn">LinkedIn</option>
  </select>
  <select id="sortBy">
    <option value="first_seen">Plus récentes (ajout)</option>
    <option value="published_at">Plus récentes (publication)</option>
  </select>
</div>

<main>
  <div class="stats" id="stats"></div>
  <div id="jobList"></div>
</main>

<script>
  let jobs = [];

  async function loadJobs() {
    try {
      const res = await fetch("../data/jobs.json?_=" + Date.now());
      jobs = await res.json();
    } catch (e) {
      jobs = [];
    }
    render();
  }

  function timeAgo(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const diffH = (Date.now() - d.getTime()) / 3600000;
    if (diffH < 1) return "il y a moins d'1h";
    if (diffH < 24) return `il y a ${Math.floor(diffH)}h`;
    return `il y a ${Math.floor(diffH / 24)}j`;
  }

  function render() {
    const q = document.getElementById("search").value.toLowerCase();
    const source = document.getElementById("sourceFilter").value;
    const sortBy = document.getElementById("sortBy").value;

    let list = jobs.filter(j => {
      const text = `${j.title} ${j.company}`.toLowerCase();
      if (q && !text.includes(q)) return false;
      if (source && j.source !== source) return false;
      return true;
    });

    list.sort((a, b) => new Date(b[sortBy] || 0) - new Date(a[sortBy] || 0));

    document.getElementById("stats").textContent =
      `${list.length} offre(s) affichée(s) sur ${jobs.length} au total`;

    const container = document.getElementById("jobList");
    if (list.length === 0) {
      container.innerHTML = `<div class="empty">Aucune offre pour ces filtres — le prochain passage du robot en trouvera peut-être.</div>`;
      return;
    }

    const isRecent = (iso) => iso && (Date.now() - new Date(iso).getTime()) < 12 * 3600000;

    container.innerHTML = list.map(j => `
      <div class="job">
        <div class="job-top">
          <div class="job-title">
            <a href="${j.url}" target="_blank" rel="noopener">${j.title || "(sans titre)"}</a>
            ${isRecent(j.first_seen) ? '<span class="new-tag"> ● nouveau</span>' : ''}
          </div>
          <span class="badge">${j.source}</span>
        </div>
        <div class="job-meta">
          <span>${j.company || "Entreprise non précisée"}</span>
          ${j.location ? `<span>${j.location}</span>` : ''}
          ${j.contract ? `<span>${j.contract}</span>` : ''}
          ${j.salary ? `<span>${j.salary}</span>` : ''}
          <span>${timeAgo(j.published_at || j.first_seen)}</span>
        </div>
      </div>
    `).join("");
  }

  document.getElementById("search").addEventListener("input", render);
  document.getElementById("sourceFilter").addEventListener("change", render);
  document.getElementById("sortBy").addEventListener("change", render);

  loadJobs();
</script>

</body>
</html>
