name: Collecte des offres d'emploi

on:
  schedule:
    # Toutes les 4 heures (adapte selon tes besoins — reste raisonnable
    # pour ne pas te faire bloquer par LinkedIn)
    - cron: "0 */4 * * *"
  workflow_dispatch: {}   # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Installation de Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Lancer la collecte
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: python fetch_jobs.py

      - name: Committer les nouvelles offres
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data/jobs.json
          git diff --quiet --cached || git commit -m "Mise à jour des offres ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
